name: Release Windows Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
        env:
          VITE_API_URL: http://121.4.21.59:3000/api/v1
      - name: Create release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --generate-notes --repo $env:GITHUB_REPOSITORY
          gh release upload $env:GITHUB_REF_NAME apps/desktop/release/Wisadel-*-x64.exe apps/desktop/release/Wisadel-*-x64.exe.blockmap apps/desktop/release/latest.yml --clobber --repo $env:GITHUB_REPOSITORY
